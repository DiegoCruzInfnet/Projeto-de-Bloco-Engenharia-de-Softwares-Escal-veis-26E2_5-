name: TP5 - CI/CD

on:
  push:
    branches:
      - tp5
      - main
  pull_request:
    branches:
      - tp5
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test Biblioteca
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postgres
          SPRING_DATASOURCE_USERNAME: postgres
          DB_PASSWORD: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
        run: mvn -B test -f Biblioteca/pom.xml

      - name: Test Loan Service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postgres
          SPRING_DATASOURCE_USERNAME: postgres
          DB_PASSWORD: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_RABBITMQ_HOST: localhost
        run: mvn -B test -f Loan_Service/loan_service/pom.xml

      - name: Test Avaliacao Service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postgres
          SPRING_DATASOURCE_USERNAME: postgres
          DB_PASSWORD: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
        run: mvn -B test -f Avaliacao_Service/avaliacao_service/pom.xml

      - name: Build Frontend
        working-directory: Biblioteca/frontend
        run: |
          npm ci
          npm run build

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push das imagens
        run: |
          REGISTRY=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          docker build -t $REGISTRY/eureka-server:latest ./Eureka_Sever/eureka_sever
          docker build -t $REGISTRY/biblioteca:latest ./Biblioteca
          docker build -t $REGISTRY/loan-service:latest ./Loan_Service/loan_service
          docker build -t $REGISTRY/avaliacao-service:latest ./Avaliacao_Service/avaliacao_service
          docker build -t $REGISTRY/notification-service:latest ./notification-service
          docker build -t $REGISTRY/biblioteca-frontend:latest ./Biblioteca/frontend

          docker push $REGISTRY/eureka-server:latest
          docker push $REGISTRY/biblioteca:latest
          docker push $REGISTRY/loan-service:latest
          docker push $REGISTRY/avaliacao-service:latest
          docker push $REGISTRY/notification-service:latest
          docker push $REGISTRY/biblioteca-frontend:latest