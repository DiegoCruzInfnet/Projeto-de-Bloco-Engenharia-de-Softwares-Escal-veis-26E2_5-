apiVersion: v1
kind: Service
metadata:
  name: avaliacao-service
  namespace: biblioteca
spec:
  selector:
    app: avaliacao-service
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avaliacao-service
  namespace: biblioteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avaliacao-service
  template:
    metadata:
      labels:
        app: avaliacao-service
    spec:
      containers:
        - name: avaliacao-service
          image: projeto_de_bloco-avaliacao-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: DB_PASSWORD
              value: "123456"
