apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: biblioteca
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'biblioteca'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['biblioteca:8080']

      - job_name: 'loan-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['loan-service:8080']

      - job_name: 'avaliacao-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['avaliacao-service:8080']

      - job_name: 'notification-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['notification-service:8080']

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: biblioteca
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: biblioteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
