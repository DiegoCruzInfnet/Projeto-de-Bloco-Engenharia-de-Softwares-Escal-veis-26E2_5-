apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: biblioteca
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: biblioteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: projeto_de_bloco-eureka-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker