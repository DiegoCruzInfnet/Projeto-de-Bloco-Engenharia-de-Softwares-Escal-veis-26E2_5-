apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: biblioteca
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: biblioteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: projeto_de_bloco-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
