apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: biblioteca
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        zipkin:

    ingester:
      trace_idle_period: 10s
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 1h

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: biblioteca
spec:
  selector:
    app: tempo
  ports:
    - name: zipkin
      port: 9411
      targetPort: 9411
    - name: query
      port: 3200
      targetPort: 3200

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: biblioteca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.5.0
          args:
            - "-config.file=/etc/tempo/tempo.yaml"
          ports:
            - containerPort: 9411
            - containerPort: 3200
          volumeMounts:
            - name: tempo-config
              mountPath: /etc/tempo
            - name: tempo-storage
              mountPath: /var/tempo
      volumes:
        - name: tempo-config
          configMap:
            name: tempo-config
        - name: tempo-storage
          emptyDir: {}
